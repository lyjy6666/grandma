<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>给奶奶的训练题</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js"></script>
</head>
<body>
    <header class="header">
        <h1>给奶奶的训练题</h1>
        <nav class="nav">
            <button class="nav-btn" onclick="showSection('games')">游戏选择</button>
            <button class="nav-btn" onclick="showSection('records')">个人记录</button>
        </nav>
    </header>

    <main class="main-content">
        <!-- 游戏选择 -->
        <section id="games" class="section active">
            <h2>选择游戏</h2>
            <div class="game-grid">
                <div class="game-card" onclick="showGameSection('memory')">
                    <h3>记忆力训练</h3>
                </div>
                <div class="game-card" onclick="showGameSection('click')">
                    <h3>点击训练</h3>
                </div>
                <div class="game-card" onclick="showGameSection('attention')">
                    <h3>注意力训练</h3>
                </div>
                
                <div class="game-card" onclick="showGameSection('seqmemory')">
                    <h3>序列记忆</h3>
                </div>
                <div class="game-card" onclick="showGameSection('reaction')">
                    <h3>反应测试</h3>
                </div>
                <div class="game-card" onclick="showGameSection('colorword')">
                    <h3>颜色词测试</h3>
                </div>
            </div>
        </section>

        <!-- 个人记录 -->
        <section id="records" class="section">
            <h2>今日训练</h2>
            <div class="records-content">
                <div class="daily-summary">
                    <h3>今日训练汇总</h3>
                    <div id="daily-stats"></div>
                    <button id="export-btn" class="nav-btn" onclick="exportDailyStats()">导出今日训练</button>
                </div>
            </div>
        </section>

        <!-- 游戏容器 -->
        <section id="game-container" class="section">
            <div class="game-header">
                <div class="game-controls">
                    <select id="difficulty-select" onchange="changeDifficulty()">
                        <option value="1">简单</option>
                        <option value="2">中等</option>
                        <option value="3">困难</option>
                    </select>
                    <button class="restart-btn" onclick="restartGame()">重新开始</button>
                </div>
            </div>
            <div id="game-area" class="game-area"></div>
            <div class="game-feedback" id="game-feedback"></div>
            <div class="game-stats">
                <span>得分：<span id="game-score">0</span></span>
                <span>时间：<span id="game-time">0</span>秒</span>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2023 老年认知训练中心. 保留所有权利.</p>
    </footer>

    <!-- 使用时长提醒 -->
    <div id="reminder" class="reminder hidden">
        <div class="reminder-content">
            <h3>休息提醒</h3>
            <p>您已经使用了30分钟，建议休息一下眼睛和身体。</p>
            <button onclick="closeReminder()">我知道了</button>
        </div>
    </div>
</body>
</html>
